name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_NAME: proxi_test
          JWT_SECRET: test-secret-key
          JWT_EXPIRY_HOURS: 72
        run: go test -v -race -cover ./...

      - name: Build binary
        run: go build -o bin/server ./cmd/server

      - name: Verify binary
        run: ./bin/server --version 2>/dev/null || echo "Binary built successfully"